<!DOCTYPE html>
<html lang="ko" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>UAM Corridor Simulator</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <!-- Top Bar -->
  <header class="topbar">
    <div class="topbar-left">
      <svg class="logo-icon" width="28" height="28" viewBox="0 0 32 32" fill="none">
        <path d="M16 3L28 10v12L16 29 4 22V10L16 3z" stroke="currentColor" stroke-width="1.5" fill="none"/>
        <path d="M16 10l6 3.5v7L16 24l-6-3.5v-7L16 10z" stroke="currentColor" stroke-width="1.2" fill="currentColor" fill-opacity="0.15"/>
        <circle cx="16" cy="17" r="2" fill="currentColor"/>
      </svg>
      <h1 class="topbar-title">UAM Corridor Simulator</h1>
      <span class="topbar-badge">v2.0</span>
    </div>
    <div class="topbar-center">
      <div class="sim-controls">
        <button class="ctrl-btn" id="btn-reset" title="초기화">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12a9 9 0 1 1 3 6.7"/><path d="M3 22v-6h6"/></svg>
        </button>
        <button class="ctrl-btn ctrl-primary" id="btn-play" title="시작/일시정지">
          <svg id="icon-play" width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><polygon points="5,3 19,12 5,21"/></svg>
          <svg id="icon-pause" width="18" height="18" viewBox="0 0 24 24" fill="currentColor" style="display:none"><rect x="5" y="3" width="4" height="18"/><rect x="15" y="3" width="4" height="18"/></svg>
        </button>
        <button class="ctrl-btn" id="btn-step" title="1스텝 진행">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="5,3 15,12 5,21" fill="currentColor"/><line x1="19" y1="3" x2="19" y2="21"/></svg>
        </button>
        <div class="speed-control">
          <label>배속</label>
          <select id="sel-speed">
            <option value="0.5">0.5x</option>
            <option value="1" selected>1x</option>
            <option value="2">2x</option>
            <option value="5">5x</option>
            <option value="10">10x</option>
          </select>
        </div>
        <div class="sim-time" id="sim-time">T = 0.0s</div>
      </div>
    </div>
    <div class="topbar-right">
      <button class="ctrl-btn" id="btn-spawn" title="기체 생성">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
        <span>기체 추가</span>
      </button>
      <button class="topbar-theme-btn" id="btn-theme" title="테마 전환">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
      </button>
    </div>
  </header>

  <!-- Main Layout -->
  <main class="app-layout">
    <!-- Left Sidebar: Aircraft List -->
    <aside class="sidebar sidebar-left" id="sidebar-left">
      <div class="sidebar-header">
        <h2>기체 목록</h2>
        <span class="badge" id="ac-count">0</span>
      </div>
      <div class="aircraft-list" id="aircraft-list">
        <div class="empty-state">
          <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" opacity="0.3">
            <path d="M12 2L2 7l10 5 10-5-10-5z"/><path d="M2 17l10 5 10-5"/><path d="M2 12l10 5 10-5"/>
          </svg>
          <p>"기체 추가" 버튼으로<br>기체를 생성하세요</p>
        </div>
      </div>
      <!-- Selected Aircraft Detail -->
      <div class="ac-detail" id="ac-detail" style="display:none">
        <div class="detail-header">
          <span class="detail-id" id="detail-id">AC #1</span>
          <button class="btn-delete" id="btn-delete" title="기체 삭제">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
          </button>
        </div>
        <div class="detail-stats">
          <div class="stat-row">
            <span class="stat-label">실제 속도</span>
            <span class="stat-value" id="detail-v-act">—</span>
          </div>
          <div class="stat-row">
            <span class="stat-label">지연율</span>
            <span class="stat-value" id="detail-delay-rate">—</span>
          </div>
          <div class="stat-row">
            <span class="stat-label">누적 지연</span>
            <span class="stat-value" id="detail-delay-time">—</span>
          </div>
          <div class="stat-row">
            <span class="stat-label">전방 지연비</span>
            <span class="stat-value" id="detail-fwd">—</span>
          </div>
        </div>
        <div class="speed-setter">
          <label>명령 속도 (kt)</label>
          <div class="speed-input-row">
            <button class="speed-btn" id="btn-speed-down">−5</button>
            <input type="number" id="input-speed" min="0" max="200" step="5" value="100">
            <button class="speed-btn" id="btn-speed-up">+5</button>
          </div>
          <input type="range" id="slider-speed" min="0" max="200" step="1" value="100" class="speed-slider">
        </div>
      </div>
    </aside>

    <!-- Center: Canvas -->
    <section class="canvas-area">
      <div class="canvas-wrapper" id="canvas-wrapper">
        <canvas id="sim-canvas"></canvas>
      </div>
      <!-- Summary Bar -->
      <div class="summary-bar" id="summary-bar">
        <div class="summary-item">
          <span class="summary-label">기체 수</span>
          <span class="summary-value" id="sum-n">0</span>
        </div>
        <div class="summary-item">
          <span class="summary-label">지연기체 비율</span>
          <span class="summary-value" id="sum-dr">0%</span>
        </div>
        <div class="summary-item">
          <span class="summary-label">총 지연</span>
          <span class="summary-value" id="sum-td">0 min</span>
        </div>
      </div>
    </section>

    <!-- Right Sidebar: Parameters -->
    <aside class="sidebar sidebar-right" id="sidebar-right">
      <div class="sidebar-header">
        <h2>파라미터</h2>
      </div>
      <div class="params-scroll">
        <!-- Visualization toggles -->
        <div class="param-section">
          <div class="param-section-title">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 9h18"/><path d="M9 21V9"/></svg>
            시각화 레이어
          </div>
          <label class="toggle-row">
            <input type="checkbox" id="chk-segments" checked>
            <span class="toggle-switch"></span>
            <span class="toggle-label">구간 혼잡도</span>
          </label>
          <label class="toggle-row">
            <input type="checkbox" id="chk-density" checked>
            <span class="toggle-switch"></span>
            <span class="toggle-label">공간 밀집도 (KDE)</span>
          </label>
          <label class="toggle-row">
            <input type="checkbox" id="chk-congestion" checked>
            <span class="toggle-switch"></span>
            <span class="toggle-label">기체 혼잡도</span>
          </label>
          <label class="toggle-row">
            <input type="checkbox" id="chk-speed-labels" checked>
            <span class="toggle-switch"></span>
            <span class="toggle-label">속도 라벨</span>
          </label>
          <label class="toggle-row">
            <input type="checkbox" id="chk-follow">
            <span class="toggle-switch"></span>
            <span class="toggle-label">선택 기체 추적</span>
          </label>
        </div>

        <!-- Vehicle Params -->
        <div class="param-section">
          <div class="param-section-title">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2L2 7l10 5 10-5-10-5z"/><path d="M2 17l10 5 10-5"/></svg>
            비행체 파라미터
          </div>
          <div class="param-row">
            <label>기준 속도 v<sub>f</sub></label>
            <div class="param-input">
              <input type="number" id="p-v-free" value="100" min="10" max="200" step="5">
              <span class="unit">kt</span>
            </div>
          </div>
          <div class="param-row">
            <label>최소 분리 sep<sub>min</sub></label>
            <div class="param-input">
              <input type="number" id="p-sep-min" value="200" min="10" max="5000" step="10">
              <span class="unit">m</span>
            </div>
          </div>
          <div class="param-row">
            <label>최대 가속 a<sub>max</sub></label>
            <div class="param-input">
              <input type="number" id="p-a-max" value="1.5" min="0.1" max="10" step="0.1">
              <span class="unit">m/s²</span>
            </div>
          </div>
          <div class="param-row">
            <label>최대 감속 b<sub>max</sub></label>
            <div class="param-input">
              <input type="number" id="p-b-max" value="2.0" min="0.1" max="10" step="0.1">
              <span class="unit">m/s²</span>
            </div>
          </div>
          <div class="param-row">
            <label>회랑 폭</label>
            <div class="param-input">
              <input type="number" id="p-lane-width" value="200" min="20" max="2000" step="20">
              <span class="unit">m</span>
            </div>
          </div>
        </div>

        <!-- Congestion Params -->
        <div class="param-section">
          <div class="param-section-title">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 12h-4l-3 9L9 3l-3 9H2"/></svg>
            혼잡 모델 파라미터
          </div>
          <div class="param-row">
            <label>구간 길이 L<sub>seg</sub></label>
            <div class="param-input">
              <input type="number" id="p-seg-len" value="10" min="0.5" max="50" step="0.5">
              <span class="unit">km</span>
            </div>
          </div>
          <div class="param-row">
            <label>구간 가중치 w<sub>over</sub></label>
            <div class="param-input">
              <input type="number" id="p-w-over" value="0.3" min="0" max="1" step="0.05">
            </div>
          </div>
          <div class="param-row">
            <label>구간 가중치 w<sub>tti</sub></label>
            <div class="param-input">
              <input type="number" id="p-w-tti" value="0.7" min="0" max="1" step="0.05">
            </div>
          </div>
          <div class="param-row">
            <label>커널 폭 σ<sub>∥</sub></label>
            <div class="param-input">
              <input type="number" id="p-sig-par" value="200" min="50" max="400" step="50">
              <span class="unit">m</span>
            </div>
          </div>
          <div class="param-row">
            <label>커널 폭 σ<sub>⊥</sub></label>
            <div class="param-input">
              <input type="number" id="p-sig-perp" value="60" min="5" max="1000" step="5">
              <span class="unit">m</span>
            </div>
          </div>
          <div class="param-row">
            <label>전방 관측 L<sub>look</sub></label>
            <div class="param-input">
              <input type="number" id="p-l-look" value="2000" min="100" max="20000" step="100">
              <span class="unit">m</span>
            </div>
          </div>
          <div class="param-row">
            <label>지연창 T</label>
            <div class="param-input">
              <input type="number" id="p-delay-t" value="60" min="10" max="3600" step="10">
              <span class="unit">s</span>
            </div>
          </div>
          <div class="param-row">
            <label>지연 임계 D<sub>thr</sub></label>
            <div class="param-input">
              <input type="number" id="p-d-thr" value="10" min="0" max="3600" step="5">
              <span class="unit">s</span>
            </div>
          </div>
          <div class="param-row">
            <label>밀도 스케일 ρ<sub>ref</sub></label>
            <div class="param-input">
              <input type="number" id="p-rho-ref" value="3" min="0.1" max="200" step="0.5">
            </div>
          </div>
          <div class="param-row">
            <label>혼잡 스케일 c<sub>ref</sub></label>
            <div class="param-input">
              <input type="number" id="p-cong-ref" value="3" min="0.1" max="200" step="0.5">
            </div>
          </div>
        </div>

        <!-- Simulation Params -->
        <div class="param-section">
          <div class="param-section-title">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
            시뮬레이션 설정
          </div>
          <div class="param-row">
            <label>타임스텝 dt</label>
            <div class="param-input">
              <input type="number" id="p-dt" value="0.2" min="0.05" max="2" step="0.05">
              <span class="unit">s</span>
            </div>
          </div>
        </div>
      </div>
    </aside>
  </main>

  <!-- Connection indicator -->
  <div class="connection-indicator" id="connection-indicator">
    <span class="dot"></span>
    <span class="label">연결 중...</span>
  </div>

  <script src="js/renderer.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
